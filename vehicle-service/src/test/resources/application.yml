spring:
  datasource:
    url: jdbc:h2:mem:vehicledb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

jwt:
  secret: DriveEaseTestSecretKeyMustBeAtLeast32BytesLong!
  expiration-ms: 3600000
