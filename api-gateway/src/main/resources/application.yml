server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: user-auth-route
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: vehicle-service-route
              uri: lb://VEHICLE-SERVICE
              predicates:
                - Path=/api/vehicles/**
            - id: booking-service-route
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:DriveEaseFleetOperationsSuperSecretKeyForHS256Signing2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
