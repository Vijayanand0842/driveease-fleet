        fromService:
          name: driveease-eureka
          type: web
          envVarKey: RENDER_EXTERNAL_URL
        property: externalUrl
      - key: JWT_SECRET
        value: DriveEaseFleetOperationsSuperSecretKeyForHS256Signing2026!

